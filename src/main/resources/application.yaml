spring:
  application:
    name: mozambique
  datasource:
      url: jdbc:h2:mem:moz_db
      driverClassName: org.h2.Driver
      username: mozambique
      password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

springdoc:
  api-docs:
    path: /v1/docs
  swagger-ui:
    path: /docs.html
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true